<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Terminal Window Controls -->
  <circle cx="80" cy="80" r="7" fill="#ef4444"/>
  <circle cx="104" cy="80" r="7" fill="#eab308"/>
  <circle cx="128" cy="80" r="7" fill="#22c55e"/>
  
  <text x="160" y="85" font-family="monospace" font-size="16" fill="#71717a">van-dev terminal</text>
  <line x1="40" y1="115" x2="1160" y2="115" stroke="#18181b" stroke-width="2"/>

  <!-- Command line prompt -->
  <text x="80" y="175" font-family="monospace" font-size="22" fill="#38bdf8">vanderson@van-dev<tspan fill="#71717a">:~$</tspan> <tspan fill="#ffffff">whoami --verbose</tspan></text>

  <!-- Name & Title -->
  <text x="80" y="270" font-family="monospace" font-size="64" font-weight="bold" fill="#ffffff">Vanderson Erlan</text>
  <text x="80" y="325" font-family="monospace" font-size="30" fill="#38bdf8">Desenvolvedor Web Full Stack</text>

  <!-- Bio / Focus -->
  <text x="80" y="390" font-family="monospace" font-size="20" fill="#a1a1aa">Construindo interfaces, sistemas e soluções para a Web.</text>

  <!-- Tags / Technologies -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="145" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="24" font-family="monospace" font-size="15" fill="#e4e4e7">Angular 17+</text>

    <rect x="160" y="0" width="130" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="176" y="24" font-family="monospace" font-size="15" fill="#e4e4e7">TypeScript</text>

    <rect x="305" y="0" width="105" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="321" y="24" font-family="monospace" font-size="15" fill="#e4e4e7">FastAPI</text>

    <rect x="425" y="0" width="95" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="441" y="24" font-family="monospace" font-size="15" fill="#e4e4e7">Python</text>

    <rect x="535" y="0" width="130" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="551" y="24" font-family="monospace" font-size="15" fill="#e4e4e7">PostgreSQL</text>

    <rect x="680" y="0" width="90" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="696" y="24" font-family="monospace" font-size="15" fill="#e4e4e7">Docker</text>

    <rect x="785" y="0" width="155" height="36" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="801" y="24" font-family="monospace" font-size="15" fill="#38bdf8">Google GenAI</text>
  </g>

  <!-- Footer Info -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#18181b" stroke-width="1"/>
  <text x="80" y="555" font-family="monospace" font-size="16" fill="#71717a">portfolio-vandev.digital • Fortaleza - Ceará</text>
  <text x="1120" y="555" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="end">● Disponível para novas oportunidades</text>
</svg>
